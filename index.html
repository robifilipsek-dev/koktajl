function missing(r){return r.items.filter(i=>!state.pantry.includes(i.n))}function cards(){let norm=s=>s.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');let list=all().filter(r=>(page!=='Priljubljeni'||state.favorites.includes(r.id))&&(filter==='Vsi'||r.base===filter)&&(!ready||!missing(r).length)&&norm(query).split(/[ ,]+/).filter(Boolean).every(w=>norm(r.name+' '+r.flavor+' '+r.base+' '+r.items.map(i=>i.n).join(' ')).includes(w)));$('#count').textContent=list.length+' receptov za tvoj naslednji kozarec';$('#cards').innerHTML=list.map(r=>'<article class="card" style="--tint:'+(['#e2e9d2','#eee4d1','#eaded1'][r.id%3]||'#e2e9d2')+'"><button class="heart" data-fav="'+r.id+'" aria-label="Priljubljeni">'+(state.favorites.includes(r.id)?'♥':'♡')+'</button><button class="open" data-recipe="'+r.id+'"><div class="picture">'+art(r)+'</div><div class="content"><span class="badge">'+esc(r.base)+' · 5 min</span><h3>'+esc(r.name)+'</h3><p class="muted">'+esc(r.flavor)+'</p><div class="row"><small>'+r.items.length+' sestavin</small><span>Pripravi ↗</span></div><div class="status">'+(missing(r).length?'Manjka '+missing(r).length+' sestavin':'✓ Vse sestavine imaš')+'</div></div></button></article>').join('')||'<div class="empty">Ni zadetkov. Spremeni filtre ali dopolni Moj bar.</div>'}

function instructions(r){let steps=[];if(r.method==='shake'||r.method==='top'){steps=['Pripravi merico, shaker in cedilo. Kozarec ohladi z ledom in vodo; tik pred nalivanjem ga izprazni.','Odmeri sestavine s seznama v shaker. Upoštevaj opombo recepta glede sestavin, ki jih dodaš posebej. Gazirano sestavino (sodo, kolo, ingverjevo pivo ali prosecco), če je na seznamu, prihrani za konec.','Shaker napolni do približno dveh tretjin s trdimi kockami ledu. Trdno zapri in močno stresaj 12–15 sekund, dokler ni zunanja stena zelo hladna.','Precedi '+(r.glass.includes('nizek')||r.glass.includes('visok')?'v kozarec s svežim ledom':'v ohlajen prazen kozarec')+'. Za gladko teksturo uporabi še fino cedilo.'];if(r.method==='top')steps.push('Na koncu počasi dolij odmerjeno gazirano sestavino in z žlico samo enkrat nežno privzdigni mešanico.')}else if(r.method==='stir')steps=['Pripravi mešalni kozarec (ali večji čist kozarec), barsko žlico, merico in cedilo. Servirni kozarec ohladi.','Odmeri vse sestavine v mešalni kozarec. Dodaj veliko trdih kock ledu.','Z barsko žlico gladko kroži ob notranji steni 20–30 sekund. Led naj kroži, ne udarjaj po njem.','Precedi '+(r.glass.includes('nizek')?'na veliko svežo kocko ledu v nizkem kozarcu':'v ohlajen kozarec brez ledu')+'.'];else if(r.method==='mojito')steps=['Zelišča oplakni in daj v visok kozarec skupaj s sokom in sirupom.','Z muddlerjem ali hrbtom žlice zelišča 2–3-krat nežno pritisni; listov ne zmelji.','Če recept vsebuje žganje, ga odmeri v kozarec. Dodaj led skoraj do vrha.','Dolij odmerjeno sodo in z dolgo žlico 2–3-krat nežno dvigni mešanico z dna.'];else steps=['Pripravi merico in '+r.glass+'. Napolni ga s svežimi kockami ledu.','Odmeri sestavine v navedenem vrstnem redu. '+(r.method==='sunrise'?'Grenadin prihrani za zadnji korak.':r.method==='cream'?'Smetano oziroma njeno zamenjavo prihrani za zadnji korak.':'Gazirane sestavine vedno vlij zadnje in počasi.'),r.method==='sunrise'?'Žganje in sok nežno premešaj. Grenadin počasi vlij po notranji steni in ne mešaj več.':r.method==='cream'?'Vodko in kavni liker premešaj. Smetano oziroma zamenjavo počasi vlij po hrbtni strani žlice.':'Z barsko žlico nežno premešaj 2–3-krat, da povežeš okuse.'];return [...steps,'Postrezi takoj. '+r.tip]}
