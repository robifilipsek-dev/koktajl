function instructions(r){let steps=[];if(r.method==='shake'||r.method==='top'){steps=['Pripravi merico, shaker in cedilo. Kozarec ohladi z ledom in vodo; tik pred nalivanjem ga izprazni.','Odmeri sestavine s seznama v shaker. Upoštevaj opombo recepta glede sestavin, ki jih dodaš posebej. Gazirano sestavino (sodo, kolo, ingverjevo pivo ali prosecco), če je na seznamu, prihrani za konec.','Shaker napolni do približno dveh tretjin s trdimi kockami ledu. Trdno zapri in močno stresaj 12–15 sekund, dokler ni zunanja stena zelo hladna.','Precedi '+(r.glass.includes('nizek')||r.glass.includes('visok')?'v kozarec s svežim ledom':'v ohlajen prazen kozarec')+'. Za gladko teksturo uporabi še fino cedilo.'];if(r.method==='top')steps.push('Na koncu počasi dolij odmerjeno gazirano sestavino in z žlico samo enkrat nežno privzdigni mešanico.')}else if(r.method==='stir')steps=['Pripravi mešalni kozarec (ali večji čist kozarec), barsko žlico, merico in cedilo. Servirni kozarec ohladi.','Odmeri vse sestavine v mešalni kozarec. Dodaj veliko trdih kock ledu.','Z barsko žlico gladko kroži ob notranji steni 20–30 sekund. Led naj kroži, ne udarjaj po njem.','Precedi '+(r.glass.includes('nizek')?'na veliko svežo kocko ledu v nizkem kozarcu':'v ohlajen kozarec brez ledu')+'.'];else if(r.method==='mojito')steps=['Zelišča oplakni in daj v visok kozarec skupaj s sokom in sirupom.','Z muddlerjem ali hrbtom žlice zelišča 2–3-krat nežno pritisni; listov ne zmelji.','Če recept vsebuje žganje, ga odmeri v kozarec. Dodaj led skoraj do vrha.','Dolij odmerjeno sodo in z dolgo žlico 2–3-krat nežno dvigni mešanico z dna.'];else steps=['Pripravi merico in '+r.glass+'. Napolni ga s svežimi kockami ledu.','Odmeri sestavine v navedenem vrstnem redu. '+(r.method==='sunrise'?'Grenadin prihrani za zadnji korak.':r.method==='cream'?'Smetano oziroma njeno zamenjavo prihrani za zadnji korak.':'Gazirane sestavine vedno vlij zadnje in počasi.'),r.method==='sunrise'?'Žganje in sok nežno premešaj. Grenadin počasi vlij function settings(){$('#main').innerHTML='<h1>Nastavitve</h1><div class="panel install-panel"><h3>Namesti aplikacijo</h3><p>Dodaj Moj bar na začetni zaslon telefona ali med aplikacije na računalniku.</p><button class="primary" data-install>⤓ Namesti aplikacijo</button></div><div class="panel"><h3>Gemini · tvoj pomočnik</h3><p>Neobvezno. Zbirka, zaloga, zamenjave in vodena priprava delujejo brez ključa.</p><p class="notice">Ključ se shrani samo v tej napravi (v brskalniku). Ob kliku »Vprašaj Gemini« se Googlu pošljejo recept, tvoja zaloga in vprašanje. Ključ ni v izvozu.</p><form id="aiSettings"><label>Gemini API ključ<br><input class="wide" id="key" type="password" autocomplete="off" value="'+esc(apiKey)+'" placeholder="Vnesi svoj ključ"></label><label class="spacer" style="display:block">Model<br><input class="wide" id="model" value="'+esc(model)+'" required pattern="[a-zA-Z0-9._-]+"></label><button class="primary spacer">Shrani</button> <button type="button" id="forget">Pozabi ključ</button></form><p><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Pridobi ključ v Google AI Studio ↗</a> · <a href="https://ai.google.dev/api/generate-content" target="_blank" rel="noopener">Dokumentacija Gemini</a></p></div><div class="panel"><h3>Tvoji podatki</h3><p>Zaloga, priljubljeni, nakupovalni seznam in tvoje različice se shranijo v tem brskalniku. Med napravami se ne sinhronizirajo samodejno.</p><button id="export">Izvozi varnostno kopijo</button> <label>Uvozi kopijo <input id="import" type="file" accept="application/json,.json"></label></div>';$('#aiSettings').onsubmit=e=>{e.preventDefault();apiKey=$('#key').value.trim();model=$('#model').value.trim();try{localStorage.setItem('mojbar-key',apiKey);localStorage.setItem('mojbar-model',model)}catch{}toast('Nastavitve so shranjene.')};$('#forget').onclick=()=>{apiKey='';$('#key').value='';try{localStorage.removeItem('mojbar-key')}catch{}toast('Ključ je odstranjen.')};$('#export').onclick=()=>{let url=UR
